[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "randencode"
version = "2.0.1"
description = "A modular arithmetic encryption tool with time-lock support"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "starkkiv", email = ""}
]
keywords = ["encryption", "modular-arithmetic", "time-lock", "crypto"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]

[project.scripts]
randencode = "randencode.cli:run_interactive"

[project.urls]
"Repository" = "https://github.com/Bon3python/randencode-improved"
"Bug Tracker" = "https://github.com/Bon3python/randencode-improved/issues"

[tool.setuptools.packages.find]
include = ["randencode*"]

[tool.setuptools]
py-modules = []